name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto = derive from commit messages since the last tag)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Preview the release notes without tagging or publishing"
        required: false
        default: false
        type: boolean
      allow_first_release:
        description: "Start versioning at v0.1.0 (only when the repo has no tags yet)"
        required: false
        default: false
        type: boolean
  # Automatic path: after every green CI run on main, the `plan` job reads
  # the conventional-commit prefixes since the last tag and decides whether
  # anything is worth shipping and how big the bump is. docs/ci/chore-only
  # pushes release nothing.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, 'chore: bump version refs'))
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Determine bump from commits since the last tag
        id: bump
        run: |
          set -euo pipefail
          if [ "${REQUESTED_BUMP}" != "auto" ]; then
            echo "Bump requested explicitly: ${REQUESTED_BUMP}"
            echo "bump=${REQUESTED_BUMP}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          RANGE="${CURRENT:+${CURRENT}..}${RELEASE_SHA}"
          echo "Classifying commits in ${RANGE}:"

          # Conventional-commit rules, semantic-release defaults:
          #   type!: / BREAKING CHANGE          -> major
          #   feat:                             -> minor
          #   fix: perf: revert:                -> patch
          #   docs: ci: chore: test: style:
          #   build: refactor:                  -> no release
          # A subject with no recognised prefix is treated as patch: this
          # is firmware, and an unlabelled code change should ship rather
          # than sit unreleased because of a commit-message slip.
          BUMP=none
          while IFS= read -r SHA; do
            SUBJECT=$(git log -1 --format=%s "$SHA")
            BODY=$(git log -1 --format=%b "$SHA")
            LEVEL=patch
            if [[ "$SUBJECT" =~ ^[A-Za-z]+(\([^\)]*\))?!: ]] || grep -qE '^BREAKING[ -]CHANGE' <<<"$BODY"; then
              LEVEL=major
            elif [[ "$SUBJECT" =~ ^feat(\([^\)]*\))?: ]]; then
              LEVEL=minor
            elif [[ "$SUBJECT" =~ ^(fix|perf|revert)(\([^\)]*\))?: ]]; then
              LEVEL=patch
            elif [[ "$SUBJECT" =~ ^(docs|ci|chore|test|tests|style|build|refactor)(\([^\)]*\))?: ]]; then
              LEVEL=none
            fi
            printf '  %-5s %s\n' "$LEVEL" "$SUBJECT"
            case "$LEVEL" in
              major) BUMP=major ;;
              minor) if [ "$BUMP" != major ]; then BUMP=minor; fi ;;
              patch) if [ "$BUMP" = none ]; then BUMP=patch; fi ;;
            esac
          done < <(git rev-list --no-merges "$RANGE")

          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${CURRENT:-the beginning}."
            {
              echo "### No release"
              echo
              echo "No feat/fix/perf commits since \`${CURRENT:-the beginning}\`; nothing to ship."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never ship without notes. On the automatic path an empty
          # Unreleased section is a skip with a warning, not a failure:
          # the fix is to add entries and push again.
          if ! python3 scripts/changelog.py extract > /dev/null 2>&1; then
            echo "::warning::Commits since ${CURRENT} warrant a ${BUMP} release, but CHANGELOG.md's Unreleased section is empty. Add entries and push again, or run the Release workflow by hand."
            {
              echo "### Release skipped"
              echo
              echo "A **${BUMP}** bump is due, but \`CHANGELOG.md\` has no Unreleased entries. Add them and push again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Automatic bump: ${BUMP}"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_BUMP: ${{ needs.plan.outputs.bump }}
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      ALLOW_FIRST_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_first_release || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ------------------------------------------------------------------
      # Gate: never tag a commit whose CI didn't pass.
      # ------------------------------------------------------------------
      - name: Require successful CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wait out an in-progress run rather than racing it: a release is
          # usually dispatched right after a push, so CI is often still going.
          DEADLINE=$(( SECONDS + 1800 ))
          while true; do
            RUN=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")]
                    | sort_by(.created_at) | last
                    | "\(.status) \(.conclusion // "none") \(.html_url)"' || true)

            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "::error::No CI run found for ${RELEASE_SHA}. Push the commit and let CI run before releasing."
              exit 1
            fi

            STATUS=$(echo "$RUN" | cut -d' ' -f1)
            CONCLUSION=$(echo "$RUN" | cut -d' ' -f2)
            URL=$(echo "$RUN" | cut -d' ' -f3)

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed for ${RELEASE_SHA}: $URL"
                break
              fi
              echo "::error::CI concluded '${CONCLUSION}' for ${RELEASE_SHA}: $URL"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after 30m waiting for CI on ${RELEASE_SHA}: $URL"
              exit 1
            fi
            echo "CI is ${STATUS}; waiting 30s... ($URL)"
            sleep 30
          done

      - name: Get current version
        id: current
        run: |
          set -euo pipefail
          # actions/checkout fetches tags with fetch-depth: 0, but a fork
          # created without them (or a repo whose tags were never pushed)
          # yields an empty list. Silently falling back to v0.0.0 there
          # would restart versioning at v0.1.0 and publish a release that
          # sorts *below* every existing one, so require an explicit
          # opt-in for the genuine first release instead.
          CURRENT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$CURRENT" ]; then
            if [ "${ALLOW_FIRST_RELEASE}" = "true" ]; then
              CURRENT="v0.0.0"
              echo "::warning::No version tags found; starting from v0.0.0 (first release opt-in)."
            else
              echo "::error::No version tags found in this repository. If this is a fork, push the upstream tags first (git push origin --tags). If this really is the first release, re-run with 'Allow first release' checked."
              exit 1
            fi
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT}"

      - name: Calculate new version
        id: new
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${RELEASE_BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *)
              echo "::error::Unknown version bump '${RELEASE_BUMP}'"
              exit 1
              ;;
          esac

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      # ------------------------------------------------------------------
      # Notes: Highlights come from CHANGELOG.md's Unreleased section.
      # Extract BEFORE tagging so an empty section fails the run early.
      # ------------------------------------------------------------------
      - name: Extract Highlights from CHANGELOG
        run: |
          python3 scripts/changelog.py extract > /tmp/highlights.md
          echo "::group::Highlights"
          cat /tmp/highlights.md
          echo "::endgroup::"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cp settings-example.yaml settings.yaml
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "test-ssid"
          wifi_password: "test-password"
          ap_wifi_ssid: "SubZero CI Fallback"
          ap_wifi_password: "test-password"
          ota_password: "ci-dummy-ota-password"
          encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Validate configs before tagging
        run: |
          REF="${RELEASE_SHA}"
          sed -i -E "s#ref: (v[0-9]+\.[0-9]+\.[0-9]+|main)#ref: ${REF}#" \
            subzero.yaml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("settings.yaml")
          text = path.read_text()
          for i in range(text.count("00:06:80:XX:XX:XX")):
              text = text.replace("00:06:80:XX:XX:XX", f"00:06:80:00:00:{i + 1:02X}", 1)
          for i in range(text.count("REPLACE_ME_6_DIGITS")):
              text = text.replace("REPLACE_ME_6_DIGITS", f"{i + 1:06d}", 1)
          path.write_text(text)
          PY
          for yaml in subzero.yaml; do
            echo "::group::Validating $yaml"
            esphome config "$yaml"
            echo "::endgroup::"
          done
          # Restore the original so the later sed/commit step operates on a clean file.
          git checkout -- subzero.yaml

      - name: Preview release notes (dry run)
        if: env.RELEASE_DRY_RUN == 'true'
        run: |
          python3 scripts/release_notes.py \
            --version "${{ steps.new.outputs.version }}" \
            --highlights /tmp/highlights.md \
            --repo "${GITHUB_REPOSITORY}" \
            --previous "${{ steps.current.outputs.version }}" \
            --out /tmp/notes.md
          {
            echo "### Dry run — ${{ steps.new.outputs.version }} would be released with these notes"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: no tag created, no release published."

      - name: Create tag on current HEAD
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          git tag "${{ steps.new.outputs.version }}"
          git push origin "${{ steps.new.outputs.version }}"

      - name: Build release notes
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ask GitHub for its auto-generated commit list, then splice it in
          # below our hand-written Highlights.
          #
          # previous_tag_name is deliberately omitted: the API rejects it
          # (HTTP 400) unless that tag already has a *published release*,
          # which isn't guaranteed here. Without it GitHub picks the previous
          # release itself, falling back to a full commit link on the first
          # release. release_notes.py supplies its own compare link if this
          # call yields nothing.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ steps.new.outputs.version }}" \
            --jq '.body' > /tmp/generated.md || : > /tmp/generated.md

          python3 scripts/release_notes.py \
            --version "${{ steps.new.outputs.version }}" \
            --highlights /tmp/highlights.md \
            --generated /tmp/generated.md \
            --repo "${GITHUB_REPOSITORY}" \
            --previous "${{ steps.current.outputs.version }}" \
            --out /tmp/notes.md

      - name: Create GitHub Release
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.new.outputs.version }}" \
            --notes-file /tmp/notes.md \
            --title "${{ steps.new.outputs.version }}" \
            ${{ env.RELEASE_PRERELEASE == 'true' && '--prerelease' || '' }}
          {
            echo "### Released ${{ steps.new.outputs.version }}"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update version references and roll CHANGELOG
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          NEW="${{ steps.new.outputs.version }}"
          sed -i "s/ref: v[0-9]*\.[0-9]*\.[0-9]*/ref: ${NEW}/g" \
            README.adoc
          sed -i -E "s/sw_version: \"[0-9]+\.[0-9]+\.[0-9]+\"/sw_version: \"${NEW#v}\"/" \
            settings-example.yaml
          # Stamp the shipped entries with this version and leave a fresh
          # empty Unreleased section for the next cycle.
          python3 scripts/changelog.py roll "${NEW}"

      - name: Commit version bump to main
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.new.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          # The push below triggers CI on main. The plan job's gate skips
          # runs whose head commit carries this message, and a chore:
          # prefix classifies as no-release anyway, so nothing recurses.
          git commit -m "chore: bump version refs to ${NEW} and roll CHANGELOG"

          # Push straight to main. This repository's Actions settings do not
          # allow workflows to open pull requests, so the earlier
          # branch-plus-PR flow left an orphan chore/bump-refs-* branch
          # behind on every release and the bump never actually landed.
          # contents: write is enough to push, and main is unprotected.
          if git push origin HEAD:refs/heads/main; then
            echo "Pushed version bump to main."
            exit 0
          fi

          # main moved while we were releasing. Rebase our single commit
          # onto it and try once more.
          git fetch origin main
          if git rebase origin/main && git push origin HEAD:refs/heads/main; then
            echo "Pushed version bump to main after rebase."
            exit 0
          fi
          git rebase --abort 2>/dev/null || true

          # Last resort: leave the bump on a branch and say so loudly.
          BRANCH="chore/bump-refs-${NEW}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          {
            echo "### Version bump could not be pushed to main"
            echo
            echo "main changed during the release and the rebase did not apply cleanly."
            echo "Merge branch \`${BRANCH}\` by hand:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Could not push the version bump to main; pushed ${BRANCH} instead."
