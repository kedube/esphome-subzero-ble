name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly canary: this repo can sit quiet for months while `pip install
  # esphome` in CI drifts to new releases — catch a compile break when it
  # happens, not when the next feature lands.
  schedule:
    - cron: "0 6 * * 1"

# No job needs anything beyond reading the repo; without this the workflow
# inherits the repository-default GITHUB_TOKEN permissions, which can be
# read/write depending on repo settings.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-tests:
    name: Parser unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache CMake deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/cpp/build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('tests/cpp/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S tests/cpp -B tests/cpp/build

      - name: Build
        run: cmake --build tests/cpp/build -j

      - name: Run tests
        # --no-tests=error: a CMake refactor that silently breaks test
        # discovery must fail the job, not pass green with zero tests run.
        run: ctest --test-dir tests/cpp/build --output-on-failure --no-tests=error

  validate:
    name: Validate ESPHome configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "test-ssid"
          wifi_password: "test-password"
          ap_wifi_ssid: "SubZero CI Fallback"
          ap_wifi_password: "test-password"
          ota_password: "ci-dummy-ota-password"
          encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Patch package refs for CI
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Point package refs to the code under test instead of a published tag.
          # PRs: use the head repo + source branch name (supports fork PRs).
          # Pushes: stay on the default repo and use the commit SHA.
          # Use # as sed delimiter — branch names may contain / (so | was used
          # before), but extended-regex alternation also needs |, which GNU
          # sed eats as the delimiter. # is safe in both pattern and replacement.
          REF="${GITHUB_HEAD_REF:-$GITHUB_SHA}"
          REPO="${HEAD_REPO:-$GITHUB_REPOSITORY}"
          # Escape sed-replacement metacharacters (&, \, and the # delimiter):
          # fork-PR branch names are attacker-chosen and would otherwise break
          # or inject into the YAML being validated.
          REF=$(printf '%s' "$REF" | sed -e 's/[\&#]/\\&/g')
          REPO=$(printf '%s' "$REPO" | sed -e 's/[\&#]/\\&/g')
          sed -i -E "s#url: https://github.com/[^[:space:]]+#url: https://github.com/${REPO}#" \
            subzero-example.yaml
          sed -i -E "s#ref: (v[0-9]+\.[0-9]+\.[0-9]+|main)#ref: ${REF}#" \
            subzero-example.yaml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("settings-example.yaml")
          text = path.read_text()
          for i in range(text.count("00:06:80:XX:XX:XX")):
              text = text.replace("00:06:80:XX:XX:XX", f"00:06:80:00:00:{i + 1:02X}", 1)
          for i in range(text.count("REPLACE_ME_6_DIGITS")):
              text = text.replace("REPLACE_ME_6_DIGITS", f"{i + 1:06d}", 1)
          path.write_text(text)
          PY

      - name: Validate configs
        run: |
          for yaml in subzero-example.yaml; do
            echo "::group::Validating $yaml"
            esphome config "$yaml"
            echo "::endgroup::"
          done

  compile:
    name: Compile ${{ matrix.file }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        file:
          - subzero-example.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "test-ssid"
          wifi_password: "test-password"
          ap_wifi_ssid: "SubZero CI Fallback"
          ap_wifi_password: "test-password"
          ota_password: "ci-dummy-ota-password"
          encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Patch package refs for CI
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Use # as sed delimiter — branch names may contain / (so | was used
          # before), but extended-regex alternation also needs |, which GNU
          # sed eats as the delimiter. # is safe in both pattern and replacement.
          REF="${GITHUB_HEAD_REF:-$GITHUB_SHA}"
          REPO="${HEAD_REPO:-$GITHUB_REPOSITORY}"
          # Escape sed-replacement metacharacters (&, \, and the # delimiter):
          # fork-PR branch names are attacker-chosen and would otherwise break
          # or inject into the YAML being validated.
          REF=$(printf '%s' "$REF" | sed -e 's/[\&#]/\\&/g')
          REPO=$(printf '%s' "$REPO" | sed -e 's/[\&#]/\\&/g')
          sed -i -E "s#url: https://github.com/[^[:space:]]+#url: https://github.com/${REPO}#" "${{ matrix.file }}"
          sed -i -E "s#ref: (v[0-9]+\.[0-9]+\.[0-9]+|main)#ref: ${REF}#" "${{ matrix.file }}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("settings-example.yaml")
          text = path.read_text()
          for i in range(text.count("00:06:80:XX:XX:XX")):
              text = text.replace("00:06:80:XX:XX:XX", f"00:06:80:00:00:{i + 1:02X}", 1)
          for i in range(text.count("REPLACE_ME_6_DIGITS")):
              text = text.replace("REPLACE_ME_6_DIGITS", f"{i + 1:06d}", 1)
          path.write_text(text)
          PY

      - name: Compile ${{ matrix.file }}
        run: esphome compile "${{ matrix.file }}"
