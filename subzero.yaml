external_components:
  - source:
      type: git
      url: https://github.com/kedube/esphome-subzero-ble
      ref: main
    components: [patch_acl_reassembly, subzero_protocol, subzero_appliance]

packages:
  settings: !include settings.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  area: ${device_area}
  platformio_options:
    build_flags:
      - "-DBOARD_HAS_PSRAM"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  variant: esp32s3
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: latest
    sdkconfig_options:
      CONFIG_BT_GATTC_CACHE_NVS_FLASH: "n"
    advanced:
      enable_ota_rollback: true

psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    esp32_ble_client: INFO
    ble_client: DEBUG
    ble_sensor: WARN
    esp32_ble_tracker: WARN
    BT_GATTC: WARN

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  min_auth_mode: WPA2
  ap:
    ssid: !secret ap_wifi_ssid
    password: !secret ap_wifi_password
  # manual_ip:
  #   static_ip: !secret static_ip
  #   gateway: !secret gateway
  #   subnet: !secret subnet
  #   dns1: !secret dns1
  #   dns2: !secret dns2

captive_portal:

esp32_ble:
  io_capability: keyboard_only
  max_connections: ${ble_max_connections}

esp32_ble_tracker:
  scan_parameters:
    active: false

debug:

sensor:
  - platform: template
    name: "Free Heap"
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);'
    unit_of_measurement: "bytes"
  - platform: template
    name: "Free PSRAM"
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);'
    unit_of_measurement: "bytes"
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: "dBm"
    update_interval: 60s
    id: wifi_signal_strength
    icon: "mdi:wifi-strength-3"

text_sensor:
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
      id: wifi_ssid
      icon: "mdi:wifi"
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      id: ip_address
      icon: "mdi:ip"
  - platform: template
    name: "Software Version"
    entity_category: diagnostic
    id: software_version
    icon: "mdi:information-variant"
    lambda: |-
      return std::string("${sw_version}");
