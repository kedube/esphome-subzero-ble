name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Preview the release notes without tagging or publishing"
        required: false
        default: false
        type: boolean
      allow_first_release:
        description: "Start versioning at v0.1.0 (only when the repo has no tags yet)"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, 'chore: bump version refs') &&
       !contains(github.event.workflow_run.head_commit.message, 'chore/bump-refs'))
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      ALLOW_FIRST_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_first_release || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ------------------------------------------------------------------
      # Gate: never tag a commit whose CI didn't pass.
      # ------------------------------------------------------------------
      - name: Require successful CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wait out an in-progress run rather than racing it: a release is
          # usually dispatched right after a push, so CI is often still going.
          DEADLINE=$(( SECONDS + 1800 ))
          while true; do
            RUN=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")]
                    | sort_by(.created_at) | last
                    | "\(.status) \(.conclusion // "none") \(.html_url)"' || true)

            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "::error::No CI run found for ${RELEASE_SHA}. Push the commit and let CI run before releasing."
              exit 1
            fi

            STATUS=$(echo "$RUN" | cut -d' ' -f1)
            CONCLUSION=$(echo "$RUN" | cut -d' ' -f2)
            URL=$(echo "$RUN" | cut -d' ' -f3)

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed for ${RELEASE_SHA}: $URL"
                break
              fi
              echo "::error::CI concluded '${CONCLUSION}' for ${RELEASE_SHA}: $URL"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after 30m waiting for CI on ${RELEASE_SHA}: $URL"
              exit 1
            fi
            echo "CI is ${STATUS}; waiting 30s... ($URL)"
            sleep 30
          done

      - name: Get current version
        id: current
        run: |
          set -euo pipefail
          # actions/checkout fetches tags with fetch-depth: 0, but a fork
          # created without them (or a repo whose tags were never pushed)
          # yields an empty list. Silently falling back to v0.0.0 there
          # would restart versioning at v0.1.0 and publish a release that
          # sorts *below* every existing one, so require an explicit
          # opt-in for the genuine first release instead.
          CURRENT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$CURRENT" ]; then
            if [ "${ALLOW_FIRST_RELEASE}" = "true" ]; then
              CURRENT="v0.0.0"
              echo "::warning::No version tags found; starting from v0.0.0 (first release opt-in)."
            else
              echo "::error::No version tags found in this repository. If this is a fork, push the upstream tags first (git push origin --tags). If this really is the first release, re-run with 'Allow first release' checked."
              exit 1
            fi
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT}"

      - name: Calculate new version
        id: new
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${RELEASE_BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *)
              echo "::error::Unknown version bump '${RELEASE_BUMP}'"
              exit 1
              ;;
          esac

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      # ------------------------------------------------------------------
      # Notes: Highlights come from CHANGELOG.md's Unreleased section.
      # Extract BEFORE tagging so an empty section fails the run early.
      # ------------------------------------------------------------------
      - name: Extract Highlights from CHANGELOG
        run: |
          python3 scripts/changelog.py extract > /tmp/highlights.md
          echo "::group::Highlights"
          cat /tmp/highlights.md
          echo "::endgroup::"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cp settings-example.yaml settings.yaml
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "test-ssid"
          wifi_password: "test-password"
          ap_wifi_ssid: "SubZero CI Fallback"
          ap_wifi_password: "test-password"
          ota_password: "ci-dummy-ota-password"
          encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Validate configs before tagging
        run: |
          REF="${RELEASE_SHA}"
          sed -i -E "s#ref: (v[0-9]+\.[0-9]+\.[0-9]+|main)#ref: ${REF}#" \
            subzero.yaml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("settings.yaml")
          text = path.read_text()
          for i in range(text.count("00:06:80:XX:XX:XX")):
              text = text.replace("00:06:80:XX:XX:XX", f"00:06:80:00:00:{i + 1:02X}", 1)
          for i in range(text.count("REPLACE_ME_6_DIGITS")):
              text = text.replace("REPLACE_ME_6_DIGITS", f"{i + 1:06d}", 1)
          path.write_text(text)
          PY
          for yaml in subzero.yaml; do
            echo "::group::Validating $yaml"
            esphome config "$yaml"
            echo "::endgroup::"
          done
          # Restore the original so the later sed/commit step operates on a clean file.
          git checkout -- subzero.yaml

      - name: Preview release notes (dry run)
        if: env.RELEASE_DRY_RUN == 'true'
        run: |
          python3 scripts/release_notes.py \
            --version "${{ steps.new.outputs.version }}" \
            --highlights /tmp/highlights.md \
            --repo "${GITHUB_REPOSITORY}" \
            --previous "${{ steps.current.outputs.version }}" \
            --out /tmp/notes.md
          {
            echo "### Dry run — ${{ steps.new.outputs.version }} would be released with these notes"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: no tag created, no release published."

      - name: Create tag on current HEAD
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          git tag "${{ steps.new.outputs.version }}"
          git push origin "${{ steps.new.outputs.version }}"

      - name: Build release notes
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ask GitHub for its auto-generated commit list, then splice it in
          # below our hand-written Highlights.
          #
          # previous_tag_name is deliberately omitted: the API rejects it
          # (HTTP 400) unless that tag already has a *published release*,
          # which isn't guaranteed here. Without it GitHub picks the previous
          # release itself, falling back to a full commit link on the first
          # release. release_notes.py supplies its own compare link if this
          # call yields nothing.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ steps.new.outputs.version }}" \
            --jq '.body' > /tmp/generated.md || : > /tmp/generated.md

          python3 scripts/release_notes.py \
            --version "${{ steps.new.outputs.version }}" \
            --highlights /tmp/highlights.md \
            --generated /tmp/generated.md \
            --repo "${GITHUB_REPOSITORY}" \
            --previous "${{ steps.current.outputs.version }}" \
            --out /tmp/notes.md

      - name: Create GitHub Release
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.new.outputs.version }}" \
            --notes-file /tmp/notes.md \
            --title "${{ steps.new.outputs.version }}" \
            ${{ env.RELEASE_PRERELEASE == 'true' && '--prerelease' || '' }}
          {
            echo "### Released ${{ steps.new.outputs.version }}"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update version references and roll CHANGELOG
        if: env.RELEASE_DRY_RUN != 'true'
        run: |
          NEW="${{ steps.new.outputs.version }}"
          sed -i "s/ref: v[0-9]*\.[0-9]*\.[0-9]*/ref: ${NEW}/g" \
            README.adoc
          sed -i -E "s/sw_version: \"[0-9]+\.[0-9]+\.[0-9]+\"/sw_version: \"${NEW#v}\"/" \
            settings-example.yaml
          # Stamp the shipped entries with this version and leave a fresh
          # empty Unreleased section for the next cycle.
          python3 scripts/changelog.py roll "${NEW}"

      - name: Create version bump PR
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.new.outputs.version }}"
          BRANCH="chore/bump-refs-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version refs to ${NEW} and roll CHANGELOG"
          git push -u origin "$BRANCH"

          # Ensure the label exists before using it: `gh pr create --label`
          # hard-fails on an unknown label, and by this point the release is
          # already tagged and published — losing the follow-up PR to a
          # missing label would leave the repo in a half-released state.
          gh label create automated \
            --description "Opened by an automated workflow" \
            --color ededed 2>/dev/null || true

          gh pr create \
            --title "chore: bump version refs to ${NEW} and roll CHANGELOG" \
            --body "Auto-generated by the release workflow. Updates example version metadata to \`${NEW}\` and moves the CHANGELOG's Unreleased entries into a \`${NEW}\` section." \
            --label "automated" \
            || gh pr create \
              --title "chore: bump version refs to ${NEW} and roll CHANGELOG" \
              --body "Auto-generated by the release workflow. Updates example version metadata to \`${NEW}\` and moves the CHANGELOG's Unreleased entries into a \`${NEW}\` section." \
            || {
              {
                echo "### Version bump branch pushed"
                echo
                echo "GitHub Actions could not create the pull request automatically."
                echo "Open it manually from branch \`${BRANCH}\`:"
                echo
                echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::GitHub Actions is not permitted to create pull requests. Pushed ${BRANCH}; open the PR manually."
            }
